version: 2
updates:
  # Application dependencies — grouped so a week's bumps arrive as two PRs, not ten.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # Keep the GitHub Actions themselves current and pinned.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
